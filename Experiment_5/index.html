<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
        <h1 align="center">Student Registration Form</h1> 
        <hr>
        <form action="#" method="post">

            <!--name-->
            <label for="FullName"> Full Name :</label> 
            <input type="text" value="" placeholder="Enter your FullName" required>
            <br><br>

            <!--Email-->
            <label for="Email">Email : </label>
            <input type="text" placeholder="Enter valid email address" required>
            <br><br>
            
            <!--Password-->
            <label for="Password">Pasword</label>
            <input type ="text" placeholder="Enter the password" required>
            <br><br>

            <!--Gender-->
            <label for="Gender" > Gender : </label>
            <input type="radio" value="male" > 
            <label for="male">male</label>
            <input type="radio"  value="female" >
            <label for="female">female</label>
            <input type="radio" value="other">
            <label for="other">Other</label>
            <br><br>
            
            <!--course-->
            <label for="Course">Course :</label>
            <select>
                <option>--select Course--</option>
            </select>
            <br><br>

            <!--Contact-->
            <label for="Contact No">Contact No: </label> 
            <input type="text" placeholder="Enter phone number">
            <br><br>

            <!--address-->
            <label for="address">Address:</label>
            <br>
            <textarea rows="5" cols="50">Enter your address</textarea>
            <br><br>

            <!--Buttons-->
            <button type="summit">Register</button>
            <button type="Reset">Clear</button>

        </form>
</body>
</html>
