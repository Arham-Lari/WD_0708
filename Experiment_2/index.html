<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
        <table border="1" align="center" cellpadding="8" cellspacing="0" style="width: 100%;">
            <caption>College Timetable -CSE Department </caption>
            <tr>
                <th>Day</th>
                <th>9:00 - 10:00</th>
                <th> 10:00 - 11:00</th>
                <th>11:00 - 12:00</th>
                <th>12:00 - 1:00 </th>
                <th>1:00 - 2:00</th>
                <th>2:00 - 3:00</th>
                <th>3:00 - 4:00</th>
            </tr>
            <tr>
                <th>Monday</th>
                <td rowspan="2">Mathematics</td>
                <td>English</td>
                <td rowspan="4">Physics</td>
                <td>Break</td>
                <td colspan="2">Computer Lab</td>
                <td>sports</td>
            </tr>
        </table>
</body>
</html>
